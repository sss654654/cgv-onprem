# booking 설정 — env 주입(없으면 로컬 기본값). docker-compose가 MYSQL_*/REDIS_*/KAFKA_* 주입.
server:
  port: ${PORT:8091}
  shutdown: graceful            # SIGTERM 시 처리 중 요청 완료 후 종료
  # 인증 없이 호출되는 API 라 본문 상한이 없으면 큰 본문을 보내는 것만으로 메모리를 밀어낼 수 있다.
  #   @Valid 의 필드 검증(좌석 8개 등)은 역직렬화가 끝난 뒤에 도는 것이라 읽는 것 자체를 막지 못한다.
  #   이 API 들이 받는 본문은 좌석 번호 몇 개 수준이다.
  tomcat:
    max-http-form-post-size: 16KB
    max-swallow-size: 16KB
    # 요청 로그 — 남용이 생겼을 때 출발지를 가릴 수 있어야 한다. Cloudflare 뒤에서는
    #   remote addr 이 엣지 주소가 되므로 엣지가 붙여 주는 CF-Connecting-IP 를 함께 남긴다.
    #   컨테이너라 파일이 아니라 stdout 으로 내보낸다. rotate·file-date-format 을 끄지 않으면
    #   Tomcat 이 이름 뒤에 날짜를 붙여 /dev/stdout.2026-08-27 을 열려다 실패한다.
    accesslog:
      enabled: true
      directory: /dev
      prefix: stdout
      suffix: ''
      file-date-format: ''
      rotate: false
      buffered: false
      pattern: '{"ts":"%t","method":"%m","path":"%U","status":%s,"ms":%D,"remote":"%a","client_ip":"%{CF-Connecting-IP}i"}'
  max-http-request-header-size: 16KB

spring:
  application:
    name: cgv-booking

  lifecycle:
    timeout-per-shutdown-phase: 30s   # graceful 종료 최대 대기

  # 가상 스레드(Java 21) — booking은 블로킹 I/O 워크로드(DB 트랜잭션 + PG 동기 호출).
  # 요청마다 가상스레드 → 블로킹 시 OS 스레드 안 묶고 파킹 → OS 스레드 풀 천장 제거 + 요청당 메모리↓.
  # 효과: 동시성 병목이 "스레드 풀"에서 "DB 커넥션 풀"로 이동(거기가 옳은 자리). 사이징은 DB 풀을 튜닝.
  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS:true}   # 2-2 k3s=true. 로컬 진단 중 env로 off 가능.

  # MySQL — 영구 기록(예매 확정). 부팅 시 mysql이 늦게 떠도 재시도되게 hikari 설정.
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:cgv}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 실질 동시성 상한 — 가상스레드가 스레드 천장을 없애니, 동시 DB 작업의 한계는 이 풀 크기.
      # X(파드당 동시 active)는 이 값·DB·PG로 정해짐 → 2-2 부하테스트로 측정·튜닝(지금은 기본값).
      maximum-pool-size: ${DB_POOL_SIZE:10}
      initialization-fail-timeout: 60000   # mysql 늦게 떠도 최대 60s 재시도(앱 레벨 readiness)
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:none}   # 기본 none: 스키마는 배포 Job이 생성. 로컬 단일파드만 DDL_AUTO=update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  # Redis — 좌석락(SET NX EX)·입장인증(admitted Set). queue와 같은 Redis 인스턴스 공유.
  # 기본(로컬·dev standalone) = host/port. k3s HA = redis-sentinel 프로파일(문서 맨 아래)로 sentinel 전환.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}   # 로컬 auth off=빈값. dev HA/prd=redis-secret(#5).

  # Kafka — admissions 소비(→admitted) / bookings-completed 발행(→queue ZREM).
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9092}
    consumer:
      group-id: booking                       # queue가 기대하는 GroupID
      auto-offset-reset: earliest             # 커밋 오프셋 없을 때만(새 그룹·만료) 적용되는 복구 정책
      enable-auto-commit: false               # 후커밋: process(SADD)→commit = 유실 없는 at-least-once
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record                        # 리스너 정상 리턴 후 오프셋 커밋(레코드 단위) = 후커밋 명시
      observation-enabled: true               # Kafka 소비 지표(micrometer). trace는 tracing bridge 추가 후
    template:
      observation-enabled: true               # Kafka 발행 지표. trace는 tracing bridge 추가 후

# 도메인 픽스값 — 시드·가격. env로 덮을 수 있게.
cgv:
  seed-on-start: ${SEED_ON_START:false}   # 기본 false: DataSeeder 멀티팟 레이스 차단. 로컬 단일파드만 true
  # 초기화 API(POST /api/admin/reset)의 인증 토큰. 비어 있으면 그 컨트롤러가 아예 등록되지 않는다.
  admin-token: ${ADMIN_TOKEN:}
  movie-id: kbo-allstar-2025
  movie-title: "2026 KBO 올스타전 생중계"
  price-per-seat: 6000
  seat-lock-ttl-seconds: ${SEAT_LOCK_TTL:45}   # 데모 45초. 실운영이면 300(5분).
  # 입장 인증 만료. queue가 회수 이벤트를 놓쳤을 때의 최후 방어라 queue의 세션 타임아웃보다 길어야 한다
  # (짧으면 정상 세션이 중간에 인증을 잃고 좌석선택이 403이 된다).
  # queue SESSION_TIMEOUT 기본 60초 → 그 3배.
  admitted-ttl-seconds: ${ADMITTED_TTL:180}
  # 한 요청에 담을 수 있는 좌석 수 상한. 상한이 없으면 좌석번호 수만 개를 담은 요청 하나가
  # 그만큼의 키를 Lua로 넘겨, queue와 공유하는 단일 스레드 Redis를 그 실행 동안 통째로 멈춘다.
  max-seats-per-request: ${MAX_SEATS_PER_REQUEST:8}
  branches: "용산아이파크몰,왕십리,영등포,강남,신촌"   # 지점 5
  screens-per-branch: 4           # 관 4 → 회차 20
  rows: 10                        # A~J
  cols: 20                        # 1~20 → 관당 200석

# 관측 — Actuator: readiness(db·redis 필수, Kafka 제외) + Prometheus metric 통로. 내부 전용.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true                        # /actuator/health/{liveness,readiness} (k8s probe용)
      group:
        readiness:
          include: readinessState,db,redis   # MySQL·Redis 죽으면 not-ready. Kafka는 자동 indicator 없음
  metrics:
    tags:
      application: cgv-booking
    distribution:
      # 버킷 없이는 히스토그램이 count·sum·max만 내보내 분위수를 못 만든다 —
      # 평균은 느린 소수를 가리고 max는 한 건이 전체를 대표해, 둘 다 사용자가 겪은 값이 아니다.
      # 경계는 queue의 queue_http_request_duration_seconds와 같은 값으로 둔다. 눈금이 같아야
      # 두 서비스의 p99를 나란히 읽는다.
      # percentiles-histogram 대신 slo로 주는 이유: 전자는 전 구간에 버킷을 자동 생성해
      # 시리즈가 수 배로 는다. 여기 적은 경계만 노출된다.
      slo:
        http.server.requests: 1ms,2500us,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s
  # 관측 trace: 전 요청 샘플링(데모 1.0) + OTLP 전송처(Tempo). Kafka observation-enabled가
  # 켜져 있어 HTTP·Kafka span은 자동 생성 — 여기선 샘플링율·전송처만 배선(코드 수술 없음).
  # 1.0인 근거: booking 요청은 확정 10건/초대라 전부 남겨도 양이 작다. queue는 폴링이
  #   사용자당 수십-수백 건이라 그쪽만 비율을 낮춘다(queue tracing.go의 경로별 샘플러).
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      # Boot 3.3.4 OTLP는 OTLP/HTTP만 지원 → 4318 HTTP 포트 + /v1/traces 경로.
      # env명은 OTLP_HTTP_ENDPOINT(queue의 gRPC용 OTLP_GRPC_ENDPOINT와 분리 — 프로토콜/포트 비호환).
      endpoint: ${OTLP_HTTP_ENDPOINT:http://localhost:4318/v1/traces}

# JDBC 구간 span (datasource-micrometer). 예매 확정 한 건을 단계로 쪼개는 부분이다.
#   connection = 커넥션 풀에서 꺼내 반납할 때까지. 풀이 마르면 이 span이 길어진다
#                — hikaricp_connections_pending이 "지금 몇 건 대기"만 주는 자리를 메운다.
#   query      = 질의 하나하나.
#   fetch(기본 포함)는 뺀다 — ResultSet 소비마다 span이 생겨 수가 크게 늘고,
#                판정에 쓰는 질문("풀이냐 질의냐")에는 답하지 않는다.
jdbc:
  includes: connection, query
  datasource-proxy:
    # 바인딩 파라미터 값(좌석번호·requestId·멱등키)을 span 속성으로 남기지 않는다.
    # 값 자체가 카디널리티이고, 예매 데이터가 트레이스 저장소로 새는 경로가 된다.
    include-parameter-values: false

---
# redis-sentinel 프로파일 — k3s HA에서만 활성(SPRING_PROFILES_ACTIVE=redis-sentinel).
# 로컬·dev standalone은 이 문서를 안 읽어 위쪽 host/port 경로 유지(빈 sentinel 블록이
# standalone을 sentinel 모드로 오인해 깨는 Spring 함정을 프로파일로 회피 — 코드-반영 #3).
spring:
  config:
    activate:
      on-profile: redis-sentinel
  data:
    redis:
      sentinel:
        master: ${REDIS_MASTER_NAME:cgvmaster}          # 차트 sentinel.masterSet와 일치
        nodes: ${REDIS_SENTINEL_NODES:redis.data.svc.cluster.local:26379}
        password: ${REDIS_PASSWORD:}                     # bitnami auth.sentinel(기본 on): sentinel도 같은 비번
